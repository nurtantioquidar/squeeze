name: Release

# Pushing a v* tag builds the binaries and publishes a GitHub release.
# Running it by hand (workflow_dispatch) only builds them, as artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # Static musl binary, so it runs on any Linux (including inside task containers).
      - run: |
          docker run --rm -v "$PWD:/src" -w /src docker.io/library/rust:1-alpine sh -c \
            'apk add --no-cache musl-dev cmake make perl clang >/dev/null && cargo build --release --locked'
      - run: |
          mkdir dist
          tar -czf dist/squeeze-linux-${{ matrix.arch }}.tar.gz -C target/release squeeze
      - uses: actions/upload-artifact@v4
        with:
          name: squeeze-linux-${{ matrix.arch }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: aarch64, target: aarch64-apple-darwin }
          - { arch: x86_64, target: x86_64-apple-darwin }
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: |
          mkdir dist
          tar -czf dist/squeeze-macos-${{ matrix.arch }}.tar.gz -C target/${{ matrix.target }}/release squeeze
      - uses: actions/upload-artifact@v4
        with:
          name: squeeze-macos-${{ matrix.arch }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
