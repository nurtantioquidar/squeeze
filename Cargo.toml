[package]
name = "squeeze"
version = "0.1.0"
description = "Cut Claude Code token spend: a hook that compresses bulky tool output, token-efficient MCP tools, and an optional cache-aware proxy for API keys"
license = "Apache-2.0"
repository = "https://github.com/nurtantioquidar/squeeze"
readme = "README.md"
keywords = ["llm", "proxy", "tokens", "mcp", "compression"]
categories = ["command-line-utilities", "development-tools"]
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
blake3 = "1.8.7"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
ignore = "0.4.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "http2", "rustls", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
